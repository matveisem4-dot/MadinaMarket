<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madina Market</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --text: #1e293b;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; color: var(--primary); }
        .admin-btn {
            background-color: #64748b;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #e2e8f0;
        }
        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .product-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }
        .product-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
        }
        .buy-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: auto;
        }
        .buy-btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <h1>Madina Market</h1>
        <a href="admin.html" class="admin-btn">Админ-панель</a>
    </header>

    <main class="products-grid" id="productsContainer">
        <!-- Товары загружаются из localStorage скриптом ниже -->
    </main>

    <script>
        function loadProducts() {
            const container = document.getElementById('productsContainer');
            const products = JSON.parse(localStorage.getItem('market_products')) || [];

            if (products.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748b;">Товаров пока нет. Добавьте их в админ-панели.</p>';
                return;
            }

            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500'}" class="product-img" alt="${product.title}">
                    <div class="product-info">
                        <h3 class="product-title">${product.title}</h3>
                        <div class="product-price">${Number(product.price).toLocaleString()} ₽</div>
                        <button class="buy-btn" onclick="alert('Вы купили ${product.title}!')">Купить</button>
                    </div>
                </div>
            `).join('');
        }

        // Обновляем список товаров при загрузке страницы
        window.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
