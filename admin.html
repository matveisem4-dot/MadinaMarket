<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madina Market - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .dark-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .card-gradient { background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%); }
        .placeholder-bg { background: linear-gradient(135deg, #f3f0ff 0%, #e0e7ff 100%); }
        .glow-border { box-shadow: 0 0 20px rgba(99, 102, 241, 0.15); }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #1e293b; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="dark-gradient min-h-screen text-white">
    <!-- Header -->
    <header class="bg-slate-900/50 backdrop-blur-xl border-b border-slate-700/50 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold">Madina Market</h1>
                        <p class="text-xs text-slate-400">Admin Dashboard</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div id="connectionStatus" class="flex items-center gap-2 px-3 py-1.5 bg-slate-800 rounded-lg text-sm">
                        <span class="w-2 h-2 rounded-full bg-red-500" id="statusDot"></span>
                        <span id="statusText">Not Connected</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Configuration Section -->
        <section class="mb-8" id="configSection">
            <div class="card-gradient rounded-2xl p-6 border border-slate-700/50 glow-border">
                <h3 class="text-lg font-semibold mb-2">🐙 Настройки GitHub API</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">GitHub Personal Access Token</label>
                        <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl text-white font-mono text-sm">
                    </div>
                    <button onclick="saveConfig()" class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl font-medium">
                        💾 Авторизоваться и Загрузить Панель
                    </button>
                </div>
            </div>
        </section>

        <!-- Status Management -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card-gradient rounded-2xl p-6 border border-slate-700/50 flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-400">Режим работы магазина</p>
                    <h4 id="workStatusLabel" class="text-xl font-bold mt-1">Загрузка...</h4>
                </div>
                <button onclick="toggleStoreStatus()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-semibold">
                    Изменить статус
                </button>
            </div>
        </section>

        <!-- Dashboard Tabs -->
        <div class="flex gap-2 mb-6 border-b border-slate-700 pb-4">
            <button onclick="showTab('products')" class="tab-btn px-6 py-3 rounded-xl font-medium bg-indigo-600 text-white">Products</button>
            <button onclick="showTab('orders')" class="tab-btn px-6 py-3 rounded-xl font-medium bg-slate-800 text-slate-400">Orders</button>
        </div>

        <!-- Products Tab -->
        <div id="productsTab" class="tab-content">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-1">
                    <div class="card-gradient rounded-2xl p-6 border border-slate-700/50">
                        <h3 class="text-lg font-semibold mb-4">Add New Product</h3>
                        <form id="addProductForm" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Product Name *</label>
                                <input type="text" id="productName" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Price (EGP) *</label>
                                <input type="number" id="productPrice" step="0.01" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Category</label>
                                <input type="text" id="productCategory" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Product Image URL (Optional)</label>
                                <input type="url" id="productImage" placeholder="https://example.com/image.jpg" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl">
                                <p class="text-xs text-slate-400 mt-1">Оставьте пустым для встроенной SVG-заглушки</p>
                            </div>
                            <button type="submit" class="w-full py-3 bg-indigo-600 rounded-xl font-medium hover:bg-indigo-500">Add Product</button>
                        </form>
                    </div>
                </div>
                <div class="lg:col-span-2">
                    <div class="card-gradient rounded-2xl p-6 border border-slate-700/50">
                        <h3 class="text-lg font-semibold mb-4">Products List</h3>
                        <div id="productsList" class="space-y-3 max-h-[500px] overflow-y-auto scrollbar-thin"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Orders Tab -->
        <div id="ordersTab" class="tab-content hidden">
            <div class="card-gradient rounded-2xl p-6 border border-slate-700/50">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold">Orders Container</h3>
                    <button onclick="loadData()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm">Refresh</button>
                </div>
                <div id="ordersList" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-4 right-4 bg-slate-800 border border-slate-700 text-white px-6 py-3 rounded-xl opacity-0 transition-all z-50">
        <span id="toastMessage"></span>
    </div>

    <script>
        const CONFIG = {
            owner: 'matveisem4-dot',
            repo: 'MadinaMarket',
            databasePath: 'database.json',
            ordersPath: 'orders.json'
        };

        let githubToken = localStorage.getItem('madina_github_token') || '';
        let cachedDbSha = '';
        let currentDatabaseState = {};

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 3000);
        }

        function saveConfig() {
            githubToken = document.getElementById('githubToken').value;
            localStorage.setItem('madina_github_token', githubToken);
            showToast('Token saved successfully!');
            loadData();
        }

        // Преобразования Base64
        function b64_to_utf8(str) { return decodeURIComponent(escape(atob(str))); }
        function utf8_to_b64(str) { return btoa(unescape(encodeURIComponent(str))); }

        async function fetchGitHub(path) {
            const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`;
            const headers = { 'Authorization': `token ${githubToken}`, 'Accept': 'application/vnd.github.v3+json' };
            const res = await fetch(url, { headers, cache: "no-store" });
            if (!res.ok) {
                if (res.status === 404 && path === CONFIG.ordersPath) return { content: [], sha: null };
                throw new Error(`Failed to load ${path}`);
            }
            const data = await res.json();
            return { content: JSON.parse(b64_to_utf8(data.content)), sha: data.sha };
        }

        async function updateGitHub(path, content, sha) {
            const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${path}`;
            const body = {
                message: `Admin configuration updated: ${path}`,
                content: utf8_to_b64(JSON.stringify(content, null, 2)),
                sha: sha
            };
            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${githubToken}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error('Could not push changes to GitHub repository');
            showToast('Database successfully updated!');
        }

        async function loadData() {
            if (!githubToken) return;
            try {
                document.getElementById('statusDot').className = "w-2 h-2 rounded-full bg-green-500";
                document.getElementById('statusText').innerText = "Connected";

                const db = await fetchGitHub(CONFIG.databasePath);
                currentDatabaseState = db.content;
                cachedDbSha = db.sha;

                document.getElementById('workStatusLabel').innerText = currentDatabaseState.isWorking ? '🟢 Открыт' : '🔴 Закрыт';
                renderProducts(currentDatabaseState.products || []);

                const ord = await fetchGitHub(CONFIG.ordersPath);
                renderOrders(ord.content || []);
            } catch (e) {
                document.getElementById('statusDot').className = "w-2 h-2 rounded-full bg-red-500";
                document.getElementById('statusText').innerText = "Auth Error";
                showToast(e.message);
            }
        }

        async function toggleStoreStatus() {
            try {
                currentDatabaseState.isWorking = !currentDatabaseState.isWorking;
                await updateGitHub(CONFIG.databasePath, currentDatabaseState, cachedDbSha);
                loadData();
            } catch (err) {
                showToast(err.message);
            }
        }

        function renderProducts(prods) {
            const list = document.getElementById('productsList');
            list.innerHTML = prods.length ? '' : '<p class="text-slate-400">No products inside the catalog</p>';
            prods.forEach(p => {
                let imgHtml = '';
                if(p.image && p.image.trim() !== '') {
                    imgHtml = `<img src="${p.image}" class="w-12 h-12 object-cover rounded-lg">`;
                } else {
                    imgHtml = `
                        <div class="w-12 h-12 placeholder-bg flex items-center justify-center rounded-lg">
                            <svg class="w-6 h-6 text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <path d="M21 15l-5-5L5 21"/>
                            </svg>
                        </div>
                    `;
                }

                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-800/50 p-4 rounded-xl border border-slate-700 mb-2">
                        <div class="flex items-center gap-3">
                            ${imgHtml}
                            <div>
                                <p class="font-bold">${p.name}</p>
                                <p class="text-sm text-slate-400">${p.price} EGP — ${p.category || 'No Category'}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderOrders(orders) {
            const list = document.getElementById('ordersList');
            list.innerHTML = orders.length ? '' : '<p class="text-slate-400">No customer orders available</p>';
            orders.forEach(o => {
                list.innerHTML += `
                    <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700 space-y-2">
                        <div class="flex justify-between font-bold">
                            <span class="text-indigo-400">${o.id || 'ORDER'}</span>
                            <span class="text-sm px-2 py-0.5 bg-slate-700 rounded text-slate-300">${o.status}</span>
                        </div>
                        <p class="text-sm text-slate-300"><b>Customer:</b> ${o.customer?.name || o.name} (${o.customer?.phone || o.phone})</p>
                        <p class="text-sm text-slate-300"><b>Address:</b> ${o.customer?.address || o.address}</p>
                        <p class="font-semibold text-green-400">Total: ${o.total} EGP</p>
                    </div>
                `;
            });
        }

        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            try {
                const imgInput = document.getElementById('productImage').value.trim();
                
                const newProd = {
                    id: 'PRD-' + Math.random().toString(36).substr(2, 9).toUpperCase(),
                    name: document.getElementById('productName').value,
                    price: parseFloat(document.getElementById('productPrice').value),
                    category: document.getElementById('productCategory').value,
                    image: imgInput, // Сохраняем пустую строку, чтобы срабатывал дефолтный SVG
                    description: 'Fresh quality product'
                };
                if(!currentDatabaseState.products) currentDatabaseState.products = [];
                currentDatabaseState.products.push(newProd);

                await updateGitHub(CONFIG.databasePath, currentDatabaseState, cachedDbSha);
                document.getElementById('addProductForm').reset();
                loadData();
            } catch (err) { showToast(err.message); }
        });

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white');
                b.classList.add('bg-slate-800', 'text-slate-400');
            });
            
            document.getElementById(tab + 'Tab').classList.remove('hidden');
            event.currentTarget.classList.remove('bg-slate-800', 'text-slate-400');
            event.currentTarget.classList.add('bg-indigo-600', 'text-white');
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(githubToken) {
                document.getElementById('githubToken').value = githubToken;
                loadData();
            }
        });
    </script>
</body>
</html>
